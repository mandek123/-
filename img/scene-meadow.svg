<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" preserveAspectRatio="xMidYMax slice">
  <!-- 만득월드 · stone-age meadow backdrop (hand-authored vector, original) -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5cc8ff"/>
      <stop offset=".75" stop-color="#bfeaff"/>
      <stop offset="1" stop-color="#fff2c9"/>
    </linearGradient>
    <radialGradient id="sun" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff7c2"/>
      <stop offset=".45" stop-color="#ffe066"/>
      <stop offset="1" stop-color="#ffe066" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8aa6d6"/>
      <stop offset="1" stop-color="#a9c3e6"/>
    </linearGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7cc95a"/>
      <stop offset="1" stop-color="#5daa43"/>
    </linearGradient>
    <linearGradient id="dirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9b47a"/>
      <stop offset="1" stop-color="#b98a52"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" fill="url(#sky)"/>
  <circle cx="980" cy="70" r="70" fill="url(#sun)"/>
  <circle cx="980" cy="70" r="26" fill="#fff4b0"/>

  <g transform="translate(0 -84)">
  <!-- volcano and far ridge -->
  <path d="M0 190 L120 140 L210 165 L330 110 L420 150 L520 120 L600 160 L700 130 L760 150 L1200 150 L1200 300 L0 300Z" fill="url(#far)"/>
  <path d="M770 160 L860 70 L895 70 L990 160Z" fill="#9b7f73" stroke="#1d1a12" stroke-width="3" stroke-linejoin="round"/>
  <path d="M860 70 L873 82 L882 72 L895 70" fill="#ff7a3d" stroke="#1d1a12" stroke-width="3" stroke-linejoin="round"/>
  <g fill="#d6d2cc" stroke="#1d1a12" stroke-width="2.5" opacity=".9">
    <circle cx="878" cy="52" r="12"/><circle cx="894" cy="36" r="15"/><circle cx="914" cy="22" r="11"/>
  </g>

  <!-- mid hills -->
  <path d="M0 220 Q150 165 300 205 T620 200 T940 195 T1200 205 L1200 300 L0 300Z" fill="url(#hill)" stroke="#1d1a12" stroke-width="3"/>

  <!-- palms and ferns -->
  <g stroke="#1d1a12" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
    <path d="M140 232 Q150 190 138 150" fill="none" stroke="#1d1a12" stroke-width="13"/>
    <path d="M140 232 Q150 190 138 150" fill="none" stroke="#8a5a2b" stroke-width="7"/>
    <path d="M138 150 Q100 140 80 165 Q110 150 138 156Z M138 150 Q170 128 200 150 Q168 146 140 156Z M138 150 Q130 115 150 98 Q145 128 142 152Z M138 150 Q105 120 92 128 Q120 132 136 154Z" fill="#4f9e3a"/>
    <path d="M1040 236 Q1052 196 1044 160" fill="none" stroke="#1d1a12" stroke-width="13"/>
    <path d="M1040 236 Q1052 196 1044 160" fill="none" stroke="#8a5a2b" stroke-width="7"/>
    <path d="M1044 160 Q1006 150 990 172 Q1016 160 1044 166Z M1044 160 Q1078 140 1104 160 Q1074 156 1046 166Z M1044 160 Q1040 128 1058 112 Q1052 140 1048 162Z" fill="#4f9e3a"/>
    <path d="M430 236 Q420 214 404 206 M430 236 Q432 210 444 198 M430 236 Q444 218 462 214" fill="none" stroke="#3f8a2e" stroke-width="5"/>
    <path d="M760 238 Q750 216 734 208 M760 238 Q762 212 774 200 M760 238 Q774 220 792 216" fill="none" stroke="#3f8a2e" stroke-width="5"/>
  </g>

  <!-- ground path where the party walks -->
  <path d="M0 248 Q300 236 600 244 T1200 242 L1200 300 L0 300Z" fill="url(#dirt)" stroke="#1d1a12" stroke-width="3"/>
  <g fill="#a8794a" opacity=".55">
    <ellipse cx="120" cy="272" rx="18" ry="5"/><ellipse cx="360" cy="282" rx="26" ry="6"/><ellipse cx="640" cy="268" rx="14" ry="4"/>
    <ellipse cx="880" cy="284" rx="24" ry="6"/><ellipse cx="1110" cy="272" rx="16" ry="5"/>
  </g>
  <g fill="#c7bba6" stroke="#1d1a12" stroke-width="2.5">
    <ellipse cx="250" cy="262" rx="14" ry="8"/><ellipse cx="980" cy="266" rx="18" ry="9"/><ellipse cx="560" cy="290" rx="12" ry="7"/>
  </g>
  </g>
  <rect x="0" y="210" width="1200" height="90" fill="#c99d63"/>
  <g fill="#a8794a" opacity=".45">
    <ellipse cx="200" cy="240" rx="30" ry="6"/><ellipse cx="520" cy="262" rx="40" ry="7"/><ellipse cx="820" cy="236" rx="26" ry="5"/><ellipse cx="1060" cy="270" rx="34" ry="7"/><ellipse cx="60" cy="282" rx="24" ry="5"/>
  </g>
</svg>
